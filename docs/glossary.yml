# docs/glossary.yml
#
# Terminology contract for the English / Chinese knowledge base.
#
# `preferred` is the term kept in English in BOTH language trees. Identifiers,
# API names, class names, function names, file names and code are never
# translated; `zh` is how the term may be glossed on first occurrence, or how it
# is spoken about in Chinese prose.
#
# The content engine does not translate anything. This file is a contract:
# the bilingual-learning skill reads it, the validator checks that files exist.

terms:
  Agent:
    preferred: Agent
    zh: Agent / 智能体

  Agent Loop:
    preferred: Agent Loop
    zh: Agent 执行循环

